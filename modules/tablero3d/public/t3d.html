<!-- Tablero 3D: marcado del módulo. Tablero3D.mount() mete cada <template data-slot> en el
     elemento del anfitrión marcado con data-t3d-slot="<nombre>" (o al final de la raíz si no lo hay).
     Todos los ids y las clases propias llevan el prefijo t3d-; las clases sin prefijo (btn, fold,
     tabs, tabpane, scenePop, tool…) son los componentes del anfitrión, los de Just Another VTT. -->

</template>

<!-- contenido de esas pestañas -->
<template data-slot="panes">
    <section class="tabpane" id="t3d-tab-scene" data-pane="t3d-scene">
      <details class="fold t3d-gm" data-fold="t3d-herramienta" id="t3d-edit" open hidden>
        <summary><span class="foldTitle">Herramienta</span></summary>
        <div class="foldBody">
          <p id="t3d-toolHelp">Clic izquierdo pinta; clic derecho y arrastrar mueve la cámara. Las teclas 1 a 9 y 0 cambian de herramienta.</p>
          <div class="row"><button class="btn" id="t3d-brush" data-ic="grid-2x2" title="Tamaño del pincel ([ y ])"><span>1×1</span></button><button class="btn" id="t3d-fill" data-ic="paint-bucket" aria-pressed="false" title="Rellenar toda la zona conectada"><span>Relleno</span></button></div>
          <div class="t3d-palFilter" id="t3d-palFilter" hidden></div>
          <div class="t3d-palgrid" id="t3d-palette" data-epane="pal"></div>
          <div class="t3d-toolOpts" id="t3d-toolOpts" hidden></div>
        </div>
      </details>
      <details class="fold t3d-gm" data-fold="t3d-esta" open>
        <summary><span class="foldTitle">Esta escena</span></summary>
        <div class="foldBody">
          <p>Se guarda sola en el tablero mientras la editas, como el 2D. «Guardar como nueva» crea una copia aparte con el nombre de abajo.</p>
          <label class="gateField"><span>Nombre</span><input id="t3d-bname" maxlength="40" aria-label="Nombre de la escena"></label>
          <p class="small muted" id="t3d-autosave" aria-live="polite"></p>
          <div class="row"><button class="btn" id="t3d-save" data-ic="save">Guardar como nueva</button></div>
        </div>
      </details>
      <details class="fold t3d-gm" data-fold="t3d-luz" open>
        <summary><span class="foldTitle">Iluminación</span></summary>
        <div class="foldBody">
          <p>Cuánta luz llega sin fuentes. Los muros tapan la vista en cualquier caso.</p>
          <div class="envGrid" id="t3d-envGrid"></div>
          <div class="rangeRow"><span>Luz ambiental</span><input id="t3d-ambient" type="range" min="0" max="100" step="1" aria-label="Luz ambiental"><output id="t3d-ambientOut"></output></div>
          <div class="rangeRow"><span>Color de la oscuridad</span><input id="t3d-darkColor" type="color" aria-label="Color de la oscuridad"></div>
          <label class="check"><input type="checkbox" id="t3d-animToggle" checked> Animar llamas y pulsos</label>
        </div>
      </details>
      <details class="fold t3d-gm" data-fold="t3d-cuadricula" open>
        <summary><span class="foldTitle">Cuadrícula</span></summary>
        <div class="foldBody">
          <p>Cada casilla mide 5 pies. En 3D las fichas y los objetos siempre van por casillas.</p>
          <label class="check"><input type="checkbox" id="t3d-gridToggle" checked> Mostrar cuadrícula</label>
        </div>
      </details>
      <details class="fold t3d-gm" data-fold="t3d-zonas" open>
        <summary><span class="foldTitle">Zonas interiores</span></summary>
        <div class="foldBody">
          <p>En un exterior con edificios o cuevas, dentro de una zona no llega la luz ambiental. Cada techo crea la suya; las ventanas y las puertas abiertas dejan entrar la luz de fuera.</p>
          <div class="row"><button class="btn" id="t3d-zoneToolBtn" data-ic="house">Dibujar zona</button></div>
        </div>
      </details>
      <details class="fold" data-fold="t3d-vista" open>
        <summary><span class="foldTitle">Vista y efectos</span></summary>
        <div class="foldBody">
          <h3 class="popSub">Cámara</h3>
          <div class="t3d-opts"><button class="btn" id="t3d-free" aria-pressed="false">Giro libre</button><button class="btn" id="t3d-angle" aria-pressed="true">Vista diagonal</button><button class="btn" id="t3d-high" aria-pressed="false">Vista alta (T)</button><button class="btn" id="t3d-miniT" aria-pressed="true">Minimapa</button><button class="btn" id="t3d-pix">Tamaño 100%</button><button class="btn" id="t3d-res">Resolución 32</button></div>
          <h3 class="popSub">Luz y ambiente</h3>
          <div class="t3d-opts"><button class="btn" id="t3d-light">Luz tramada</button><button class="btn" id="t3d-outline" aria-pressed="true">Contornos</button><button class="btn" id="t3d-decor" aria-pressed="true">Decoración</button></div>
          <h3 class="popSub">Objetos y muros</h3>
          <div class="t3d-opts"><button class="btn" id="t3d-walls" aria-pressed="false">Muros bajos</button><button class="btn" id="t3d-roofsBtn">Techos: automáticos (I)</button><button class="btn" id="t3d-solid" aria-pressed="false">Todo gira con el mundo</button></div>
        </div>
      </details>
    </section>
    <section class="tabpane" id="t3d-tab-tokens" data-pane="t3d-tokens">

    </section>

        <div class="foldBody"><div class="t3d-wrap" id="t3d-gMeasure"></div></div>
      </details>
    </section>
    <section class="tabpane" id="t3d-tab-camp" data-pane="t3d-camp">

        <summary><span class="foldTitle">Campaña</span></summary>
        <div class="foldBody"><div class="t3d-wrap" id="t3d-gCamp"></div></div>
      </details>
    </section>
</template>

<template data-slot="overlays">

  <div id="t3d-list"></div>
  <div class="t3d-gm">
    <h3 class="popSub">Nueva escena</h3>
    <label class="gateField"><span>Nombre</span><input id="t3d-newName" maxlength="40" placeholder="Tablero nuevo" aria-label="Nombre de la escena nueva"></label>
    <div class="sceneCreate">
      <button class="btn" id="t3d-newSize" title="Cambia el tamaño de la escena nueva">Nuevo 16×16</button>
      <select id="t3d-newTerr" aria-label="Terreno base"><option value="g">Pasto</option><option value="a">Arena</option><option value="p">Camino</option><option value="c">Adoquín</option><option value="s">Piedra</option><option value="o">Madera</option><option value="n">Nieve</option></select>
      <select id="t3d-newEnv" aria-label="Iluminación de la escena nueva"><option value="day">Exterior de día</option><option value="dusk">Atardecer</option><option value="night">Noche</option><option value="interior">Interior</option></select>

      <summary><span class="foldTitle">Empezar desde una plantilla</span></summary>
      <div class="foldBody">

        <div class="t3d-opts"><button class="btn" data-map="demo" aria-pressed="false">Claro 8×8</button><button class="btn" data-map="d64" aria-pressed="false">Mazmorra 64×64</button><button class="btn" data-map="d128" aria-pressed="false">Mazmorra 128×128</button><button class="btn" data-map="town" aria-pressed="false">Pueblo de Brezo 48×40</button><button class="btn" data-map="lights" aria-pressed="false">Taller de luces 43×24</button></div>
      </div>

  <p class="small muted">Las escenas guardadas son de todo el tablero. Una escena nueva se abre sin guardar: guárdala con Ctrl+S o en la pestaña Escena.</p>
</div>
<div id="t3d-helpSheet" class="scenePop" hidden role="dialog" aria-label="Controles y atajos">
  <div class="t3d-popHead"><h2>Controles y atajos</h2><button data-close="helpSheet" class="btn sq ghost" data-ic="x" aria-label="Cerrar"></button></div>
  <h3 class="popSub">Ratón</h3>
  <p class="small">Arrastrar: mover la cámara (en edición, pintar)<br>Clic derecho o central y arrastrar: girar; al soltar se ajusta al ángulo más cercano<br>Mayús + clic derecho, o Espacio + arrastrar: mover la cámara<br>Rueda: acercar hacia el cursor. Mayús + rueda: girar 90°<br>Doble clic: centrar la cámara en esa casilla<br>Arrastrar un personaje: moverlo (muestra la distancia en pies)<br>Clic derecho sin arrastrar: menú de la casilla o del personaje</p>
  <h3 class="popSub">Teclado</h3>
  <p class="small">WASD o flechas: mover la cámara (Mayús, más rápido)<br>Q y E: girar. + y −: acercar y alejar<br>F: centrar en el personaje elegido. Tab: siguiente personaje<br>H: volver a la vista inicial. T: vista alta. I: techos. N: siguiente turno en combate. R: girar la luz dirigida (herramienta Luz; Mayús+R al revés). Esc: cerrar paneles<br>Director: 1 a 9 y 0 eligen herramienta (8 luz, 9 nivelar, 0 borrar), M la de muros (R gira el elegido) y Z la de zonas interiores; [ y ] cambian el pincel; Ctrl+Z y Ctrl+Y; Ctrl+S guarda la escena</p>
  <h3 class="popSub">Táctil</h3>
  <p class="small">Un dedo: mover la cámara (en edición, pintar); sobre un personaje, arrastrarlo<br>Mantener pulsado: menú de la casilla o del personaje<br>Dos dedos: mover, pellizcar para acercar y girar para rotar el tablero</p>
  <h3 class="popSub">Editor de dibujo</h3>
  <p class="small">Clic derecho: color secundario. Alt + clic: gotero. Mayús + clic: línea desde el último punto<br>Espacio o clic central: mover el lienzo. Dos dedos: deshacer; tres: rehacer; mantener pulsado: gotero<br>
    B lápiz, E borrador, G cubeta, I gotero, L línea, U rectángulo, O elipse, A aerógrafo, K degradado, M selección, W varita, Q lazo, V mover, S sombra, D tramado, H mano<br>
    [ y ]: tamaño del pincel (1 a 8). X: intercambiar colores. Ctrl+A: seleccionar todo. Ctrl+I: invertir la selección. Mayús + varita o lazo: sumar a la selección<br>
    Flechas: mover la selección (Mayús, de 4 en 4); sin selección, cambiar de cuadro. , y .: cuadro anterior y siguiente</p>
</div>

<section class="t3d-art" id="t3d-art" hidden aria-label="Editor de pixel art">

    <button class="btn sq ghost" id="t3d-artClose" data-ic="arrow-left" title="Volver al tablero" aria-label="Volver al tablero"></button>
    <span class="brand hideSm">Dibujo</span>
    <div class="t3d-doc-title"><input id="t3d-artName" maxlength="30" aria-label="Nombre del dibujo"><small id="t3d-artDocInfo"></small></div>
